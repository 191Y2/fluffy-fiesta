<body>
<div id="pinScreen" class="pin-screen">
  <form id="pinForm" class="pin-box">
    <div class="pin-logo">ϟ</div>
    <h1>Ace</h1>
    <p>Your personal dashboard workspace</p>
    <div><label for="accessCode">Access code</label><input id="accessCode" type="password" autocomplete="current-password" placeholder="Enter your access code" required /></div>
    <div id="pinError" class="pin-error" aria-live="polite"></div>
    <button class="btn primary" type="submit">Unlock workspace</button>
    <button type="button" id="accessRequestBtn" class="access-link">Get an access code for free</button>
  </form>
</div>
<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><span class="brand-mark">ϟ</span><span>Ace</span><button class="icon-btn collapse-btn" id="collapseSidebar" aria-label="Collapse sidebar" title="Collapse sidebar">◫</button></div>
    <div class="sidebar-actions">
      <button id="newChatBtn" class="new-chat"><span style="font-size:20px;color:#aaa">＋</span> New chat</button>
      <div class="search-wrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input class="search" id="chatSearch" placeholder="Search chats (Ctrl+K)" aria-label="Search chats" /></div>
    </div>
    <nav id="history" class="history" aria-label="Saved chats"></nav>
    <div class="sidebar-bottom">
      <button class="bottom-item" id="memoryBtn"><span>◉</span> <span>Memory</span> <span id="memoryCount" class="small-muted">0</span></button>
      <button class="bottom-item" id="settingsBtn"><span>⚙</span> Settings</button>
      <div class="user-row"><div class="avatar">A</div><div><div style="font-weight:600;font-size:12px">You</div><div class="small-muted"><span class="status-dot" id="statusDot"></span><span id="saveState">Saved on this device</span></div></div></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-left"><button id="showSidebar" class="icon-btn" title="Show sidebar" aria-label="Show sidebar">☰</button></div>
      <div class="top-center"><button class="seg active" id="chatModeBtn">Chat</button><button class="seg" id="agentModeBtn" title="Agent mode is not configured in this version">Agent</button></div>
      <div class="top-right">
        <button class="model-pill" id="smartModelBtn"><span>☆</span><span id="activeModelLabel">Smart models</span><span>⌄</span></button>
        <button class="icon-btn" id="exportBtn" aria-label="Export chat" title="Export conversation">⇩</button>
        <button class="icon-btn" id="printBtn" aria-label="Print" title="Print conversation">▤</button>
        <button class="icon-btn" id="topSettingsBtn" aria-label="Settings" title="Settings">⚙</button>
      </div>
    </header>
    <section id="chatScroll" class="chat-scroll" aria-label="Conversation">
      <div id="messages" class="messages"></div>
    </section>
    <div class="composer-wrap">
      <div class="composer-inner">
        <div id="filePreviews" class="file-previews"></div>
        <div class="composer">
          <textarea id="prompt" class="prompt" rows="1" placeholder="Ask anything — homework, essays, quizzes, research" aria-label="Message"></textarea>
          <div class="composer-row">
            <div class="composer-tools">
              <button id="attachBtn" class="tool-btn" title="Attach files" aria-label="Attach files"><span style="font-size:20px;line-height:12px">＋</span><span class="tool-label">Attach</span></button>
              <input id="fileInput" type="file" multiple accept=".pdf,.txt,.md,.csv,.json,.html,.htm,.css,.js,.xml,.docx,.png,.jpg,.jpeg,.webp,.gif" hidden />
              <button class="tool-btn" data-mode="think" title="Use more deliberate reasoning">Think</button>
              <button class="tool-btn" data-mode="deep" title="Ask for a thorough, structured answer">Deep</button>
              <button class="tool-btn" data-mode="web" title="Live web search is not configured">Web</button>
              <button class="tool-btn" data-mode="essay" title="Use an essay-style response">Essay</button>
            </div>
            <button id="sendBtn" class="send-btn" title="Send message" aria-label="Send message">↑</button>
            <button id="stopBtn" class="stop-btn hidden" title="Stop generation" aria-label="Stop generation">■</button>
          </div>
        </div>
        <div class="footnote">Ace can make mistakes — check what matters. <a href="#" id="memoryInline">0 memories in context</a></div>
      </div>
    </div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalHost"></div>
<script>
(() => {
'use strict';
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => Array.from(root.querySelectorAll(s));
const FREE_MODELS = [
  {id:'openai/gpt-oss-20b', name:'GPT-OSS 20B', type:'text', note:'Groq · general chat'},
  {id:'openai/gpt-oss-120b', name:'GPT-OSS 120B', type:'text', note:'Groq · stronger reasoning'},
  {id:'qwen/qwen3.8-27b', name:'Qwen 3.8 27B', type:'vision', note:'Groq · text + image understanding'}
];
const DEFAULT_ENDPOINT = '/api/chat';
const ACCESS_CODE = '45$5'; // This is a casual front-end gate, not secure authentication.
const DB_NAME = 'ace-workspace-db';
const DB_VERSION = 1;
let dbPromise;
let chats = [];
let activeChatId = null;
let pendingFiles = [];
let busy = false;
let activeController = null;
let activeModes = new Set();
let flowTimer = null;
let currentModal = null;
let toastTimer = null;
let memory = loadJSON('ace_memory_v1', []);
let appSettings = loadJSON('ace_settings_v1', {
  endpoint: DEFAULT_ENDPOINT,
  model: 'openai/gpt-oss-20b',
  apiKey: '',
  rememberKey: false,
  systemPrompt: 'You are Ace, a helpful assistant. Be accurate, practical, and clear. If you are uncertain, say so. Never claim to have opened or read an attachment unless its extracted contents were included in the message.',
  theme: 'dark',
  stream: true,
  pinLockMinutes: 30
});
if (!Array.isArray(memory)) memory = [];
if (!appSettings || typeof appSettings !== 'object') appSettings = {};
appSettings.endpoint = DEFAULT_ENDPOINT;
// Never retain API secrets in the browser's saved settings. Older Ace builds stored them locally.
if (appSettings.apiKey) { delete appSettings.apiKey; }
appSettings.model = FREE_MODELS.some(m=>m.id===appSettings.model) ? appSettings.model : 'openai/gpt-oss-20b';
let localApiConfigured = false;
if (localStorage.getItem('ace_settings_v1')) saveJSON('ace_settings_v1', appSettings);


function loadJSON(key, fallback){ try { const value=localStorage.getItem(key); return value ? JSON.parse(value) : fallback; } catch { return fallback; } }
function saveJSON(key, value){ try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch(e){ console.warn(e); return false; } }
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB is not available in this browser.'));
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => { const d=request.result; if(!d.objectStoreNames.contains('chats')) d.createObjectStore('chats',{keyPath:'id'}); };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('Could not open local chat storage.'));
  });
  return dbPromise;
}
async function dbGetAll(){ const db=await openDB(); return new Promise((resolve,reject)=>{const req=db.transaction('chats','readonly').objectStore('chats').getAll(); req.onsuccess=()=>resolve(req.result||[]); req.onerror=()=>reject(req.error);}); }
async function dbPut(chat){ const db=await openDB(); return new Promise((resolve,reject)=>{const tx=db.transaction('chats','readwrite');tx.objectStore('chats').put(chat);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('Chat save failed'));}); }
async function dbDelete(id){ const db=await openDB(); return new Promise((resolve,reject)=>{const tx=db.transaction('chats','readwrite');tx.objectStore('chats').delete(id);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);}); }
const uid = () => (crypto?.randomUUID ? crypto.randomUUID() : 'chat-'+Date.now()+'-'+Math.random().toString(36).slice(2,9));

function renderMarkdownSafe(markdown){
  // Small dependency-free Markdown renderer. It escapes HTML before rendering any formatting.
  const text=String(markdown??'').replace(/\r\n?/g,'\n');
  const blocks=text.split(/```/);let out='';
  for(let i=0;i<blocks.length;i++){
    if(i%2===1){const firstNL=blocks[i].indexOf('\n');const lang=firstNL>=0?blocks[i].slice(0,firstNL).trim():'';const code=firstNL>=0?blocks[i].slice(firstNL+1):blocks[i];out+='<pre><code'+(lang?' class="language-'+escapeHTML(lang.replace(/[^\w-]/g,''))+'"':'')+'>'+escapeHTML(code.replace(/\n$/,''))+'</code></pre>';continue;}
    const lines=blocks[i].split('\n');let inList=false;let listType='';let paragraph=[];
    const flushP=()=>{if(paragraph.length){out+='<p>'+inlineMarkdown(paragraph.join('\n')).replace(/\n/g,'<br>')+'</p>';paragraph=[];}};
    const flushL=()=>{if(inList){out+='</'+listType+'>';inList=false;listType='';}};
    for(const line of lines){
      const h=line.match(/^(#{1,3})\s+(.+)$/);const li=line.match(/^\s*([-*+] |\d+\. )(.+)$/);
      if(h){flushP();flushL();const n=h[1].length;out+='<h'+n+'>'+inlineMarkdown(h[2])+'</h'+n+'>';}
      else if(li){flushP();const type=/^\s*\d/.test(line)?'ol':'ul';if(!inList||listType!==type){flushL();out+='<'+type+'>';inList=true;listType=type;}out+='<li>'+inlineMarkdown(li[2])+'</li>';}
      else if(!line.trim()){flushP();flushL();}
      else {flushL();paragraph.push(line);}
    }flushP();flushL();
  }
  return out || '<p></p>';
}
function inlineMarkdown(s){ let x=escapeHTML(s); x=x.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,'$1<em>$2</em>').replace(/~~(.+?)~~/g,'<del>$1</del>');return x; }
function messageNode(msg,index){

    if(msg.status==='streaming'){const typing=document.createElement('div');typing.className='typing';typing.innerHTML='<span></span><span></span><span></span>';body.append(typing);}

    const regen=document.createElement('button');regen.title='Regenerate response';regen.textContent='⟳';regen.addEventListener('click',()=>regenerate(msg.id));
    const good=document.createElement('button');good.title='Helpful';good.textContent='♧';good.addEventListener('click',()=>toast('Thanks for the feedback.'));
    const bad=document.createElement('button');bad.title='Not helpful';bad.textContent='♧';bad.style.transform='rotate(180deg)';bad.addEventListener('click',()=>toast('Feedback noted for this session.'));

async function extractPDF(file){if(file.size>18*1024*1024)throw new Error('PDF exceeds the 18 MB local processing limit.');const pdfjs=await loadPDFJS();const buf=await file.arrayBuffer();const pdf=await pdfjs.getDocument({data:buf}).promise;if(pdf.numPages>40)throw new Error('This version processes at most 40 PDF pages at a time.');let pages=[];for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n);const c=await p.getTextContent();pages.push(c.items.map(i=>i.str).join(' '));}const text=pages.map((p,i)=>`[Page ${i+1}]\n${p}`).join('\n\n');if(text.replace(/\s/g,'').length<30)throw new Error('This PDF appears to contain mostly scanned pages or images. Text extraction found almost nothing. This version does not run free OCR automatically; use a text-based PDF or attach page screenshots to the vision model.');return text.slice(0,80000);}
async function extractDocx(file){
  // Minimal DOCX text extraction from its ZIP container using browser-native decompression.
  const buf=await file.arrayBuffer();const u=new Uint8Array(buf);const view=new DataView(buf);let eocd=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--){if(view.getUint32(i,true)===0x06054b50){eocd=i;break;}}if(eocd<0)throw new Error('Could not read the DOCX ZIP directory.');const count=view.getUint16(eocd+10,true);const cdOff=view.getUint32(eocd+16,true);let off=cdOff;for(let i=0;i<count;i++){if(view.getUint32(off,true)!==0x02014b50)break;const comp=view.getUint16(off+10,true),csize=view.getUint32(off+20,true),nlen=view.getUint16(off+28,true),elen=view.getUint16(off+30,true),clen=view.getUint16(off+32,true),localOff=view.getUint32(off+42,true);const name=new TextDecoder().decode(u.slice(off+46,off+46+nlen));if(name==='word/document.xml'){const ln=view.getUint16(localOff+26,true),le=view.getUint16(localOff+28,true),start=localOff+30+ln+le;let bytes=u.slice(start,start+csize);if(comp===8){if(!('DecompressionStream'in window))throw new Error('This browser cannot decompress DOCX content.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(stream).arrayBuffer());}else if(comp!==0)throw new Error('DOCX compression method is not supported.');const xml=new DOMParser().parseFromString(new TextDecoder().decode(bytes),'application/xml');return Array.from(xml.getElementsByTagName('w:p')).map(p=>Array.from(p.getElementsByTagName('w:t')).map(t=>t.textContent||'').join('')).join('\n').slice(0,80000);}off+=46+nlen+elen+clen;}throw new Error('Could not find the main document text inside this DOCX file.');
}
async function processFiles(files){const allowed=files.filter(f=>f.size<=18*1024*1024);if(allowed.length<files.length)toast('Files over 18 MB were skipped.');for(const f of allowed){if(pendingFiles.length>=6){toast('Up to 6 attachments per message.');break;}if(pendingFiles.some(x=>x.name===f.name&&x.size===f.size)){continue;}const ext=(f.name.split('.').pop()||'').toLowerCase();const isImageFile=f.type.startsWith('image/')||['png','jpg','jpeg','webp'].includes(ext);if(isImageFile&&pendingFiles.filter(x=>x.kind==='image').length>=3){toast('Qwen 3.8 27B supports at most 3 images per request; extra image skipped.');continue;}const item={id:uid(),file:f,name:f.name,size:f.size,type:f.type,kind:'unsupported',text:'',dataUrl:null,loading:true,error:''};pendingFiles.push(item);renderFilePreviews();try{
    if(f.type.startsWith('image/')||['png','jpg','jpeg','webp'].includes(ext)){if(!['png','jpg','jpeg','webp'].includes(ext))throw new Error('Use a PNG, JPG, or WEBP image.');if(f.size>8*1024*1024)throw new Error('Images must be 8 MB or smaller.');item.kind='image';item.dataUrl=await dataURLFromFile(f);}
    else if(ext==='pdf'||f.type==='application/pdf'){item.kind='text';item.text=await extractPDF(f);}
    else if(ext==='docx'){item.kind='text';item.text=await extractDocx(f);}
    else if(['txt','md','csv','json','html','htm','css','js','xml'].includes(ext)||f.type.startsWith('text/')){item.kind='text';item.text=(await f.text()).slice(0,80000);}
    else {item.kind='unsupported';item.error='This format is not supported yet. Try a PDF, DOCX, text file, CSV, JSON, HTML/CSS/JS, or image.';}
  }catch(e){item.error=e?.message||String(e);item.kind='error';}finally{item.loading=false;renderFilePreviews();}}
}
function renderFilePreviews(){const root=$('#filePreviews');root.replaceChildren();for(const item of pendingFiles){const chip=document.createElement('div');chip.className='file-chip';const symbol=item.kind==='image'?'▧':item.kind==='text'?'▤':'⚠';const name=document.createElement('span');name.textContent=symbol+' '+item.name+(item.loading?' · reading…':item.error?' · unavailable':'');name.className='fname';name.title=item.error||item.name;if(item.error)name.style.color='#f2aaaa';const remove=document.createElement('button');remove.textContent='×';remove.title='Remove attachment';remove.addEventListener('click',()=>{pendingFiles=pendingFiles.filter(x=>x.id!==item.id);renderFilePreviews();});chip.append(name,remove);root.append(chip);}}
function buildUserContent(text, files){const usable=files.filter(f=>!f.loading&&!f.error);const content=[];let promptText=text||'';const textFiles=usable.filter(f=>f.kind==='text');if(textFiles.length){promptText+='\n\nAttached file contents:\n'+textFiles.map(f=>`--- BEGIN FILE: ${f.name} ---\n${f.text}\n--- END FILE: ${f.name} ---`).join('\n\n');}if(promptText)content.push({type:'text',text:promptText});for(const f of usable.filter(f=>f.kind==='image'))content.push({type:'image_url',image_url:{url:f.dataUrl}});return content.length===1&&content[0].type==='text'?promptText:content;}
function addMemoryHint(){return memory.length?' (memory included)':'';}
function updateChatTitle(chat,firstText){if(chat.title==='New chat'||!chat.title){chat.title=titleFrom(firstText||'New chat');}}
function requestPayload(chat, stream, modes=activeModes){const messages=[{role:'system',content:composeSystem(modes)}];for(const m of chat.messages){if(m.role==='assistant'&&(m.status==='error'||m.status==='streaming'))continue;if(m.role==='user'){
      let content=m.text||'';if(m.extractedText?.length)content+='\n\nAttached file contents:\n'+m.extractedText.map(f=>`--- BEGIN FILE: ${f.name} ---\n${f.text}\n--- END FILE: ${f.name} ---`).join('\n\n');
      const parts=[];if(content)parts.push({type:'text',text:content});for(const img of (m.images||[]))parts.push({type:'image_url',image_url:{url:img.dataUrl}});messages.push({role:'user',content:parts.length===1&&parts[0].type==='text'?content:parts});
    } else {messages.push({role:'assistant',content:m.text||''});}}
  return {model:chat.messages.some(m=>m.role==='user'&&m.images?.length)?'qwen/qwen3.8-27b':appSettings.model,messages,stream,...(stream?{}:{max_completion_tokens:2048})};}
async function sendMessage(retryText=null, regenMsgId=null){
  if(busy)return;const inputText=(retryText??$('#prompt').value).trim();const files=retryText===null?[...pendingFiles]:[];if(!inputText&&!files.length&&!regenMsgId)return;
  const invalid=files.find(f=>f.loading||f.error);if(invalid){toast(invalid.loading?'Wait for the attachment to finish reading.':invalid.name+': '+invalid.error);return;}
  try{const sr=await fetch('/api/status',{cache:'no-store'});const sd=await sr.json();localApiConfigured=!!sd.key_configured;}catch{toast('Ace cannot reach its local helper. Start ace_local.py and open http://127.0.0.1:8765.');return;}if(!localApiConfigured){toast('Add your Groq API key in Settings first.');showSettings();return;}
  let chat=activeChat();if(!chat){const c={id:uid(),title:'New chat',messages:[],createdAt:Date.now(),updatedAt:Date.now()};chats.unshift(c);activeChatId=c.id;chat=c;}
  const messageText=inputText||'Please analyze the attached file(s).';
  let extractedText=[];let images=[];let fileMeta=[];if(files.length){extractedText=files.filter(f=>f.kind==='text').map(f=>({name:f.name,text:f.text}));images=files.filter(f=>f.kind==='image').map(f=>({name:f.name,dataUrl:f.dataUrl}));fileMeta=files.map(f=>({name:f.name,size:f.size,kind:f.kind}));}
  if(regenMsgId){const idx=chat.messages.findIndex(m=>m.id===regenMsgId);if(idx>=0){chat.messages=chat.messages.slice(0,idx);}}
  else {chat.messages.push({id:uid(),role:'user',text:messageText,images,extractedText,files:fileMeta,createdAt:Date.now()});}
  updateChatTitle(chat,messageText);chat.updatedAt=Date.now();
  const bot={id:uid(),role:'assistant',text:'',modelName:modelInfo(images.length?'qwen/qwen3.8-27b':appSettings.model).name,status:'streaming',thinking:activeModes.has('deep')?'Generating a detailed response…':''};chat.messages.push(bot);const sentModes=new Set(activeModes);activeModes.clear();$$('[data-mode]').forEach(b=>b.classList.remove('on'));$('#prompt').value='';autoGrow();pendingFiles=[];renderFilePreviews();busy=true;$('#sendBtn').classList.add('hidden');$('#stopBtn').classList.remove('hidden');$('#prompt').disabled=true;renderAll();
  activeController=new AbortController();let firstChunk=false;
  try{
    const payload=requestPayload(chat,appSettings.stream,sentModes);if(payload.model!==appSettings.model){bot.modelName=modelInfo(payload.model).name;}
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Accept':appSettings.stream?'text/event-stream':'application/json'},body:JSON.stringify(payload),signal:activeController.signal});
    if(!res.ok){const t=await res.text();let message=t;try{const j=JSON.parse(t);message=j?.error?.message||j?.message||t;}catch{}throw new Error('Local helper / Groq returned HTTP '+res.status+': '+String(message).slice(0,700));}
    if(appSettings.stream&&res.body){const reader=res.body.getReader();const decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines){const trimmed=line.trim();if(!trimmed.startsWith('data:'))continue;const raw=trimmed.slice(5).trim();if(!raw||raw==='[DONE]')continue;let chunk;try{chunk=JSON.parse(raw);}catch{continue;}if(chunk.error)throw new Error(chunk.error.message||'Streaming request failed.');const piece=chunk.choices?.[0]?.delta?.content;if(typeof piece==='string'&&piece){bot.text+=piece;firstChunk=true;bot.status='streaming';updateStreamingMessage(bot);}}}if(buffer.trim().startsWith('data:')){const raw=buffer.trim().slice(5).trim();if(raw&&raw!=='[DONE]'){try{const chunk=JSON.parse(raw);const piece=chunk.choices?.[0]?.delta?.content;if(typeof piece==='string')bot.text+=piece;}catch{}}}}
    else{const data=await res.json();const content=data?.choices?.[0]?.message?.content;if(typeof content==='string')bot.text=content;else if(Array.isArray(content))bot.text=content.map(p=>p.text||'').join('\n');else bot.text='The API returned a response, but its content format was not recognized.';}
    bot.status='done';if(!bot.text.trim())bot.text='The API returned no text. Try another free model or inspect the API response in Settings.';chat.updatedAt=Date.now();await persistChat(chat);renderAll();startFlowFinish(bot.id);if(!firstChunk)scrollBottom();
  }catch(e){if(e?.name==='AbortError'){bot.status='stopped';if(!bot.text)bot.text='Generation stopped.';}else{bot.status='error';bot.text='**Request failed**\n\n'+(e?.message||String(e))+'\n\nThis version sends requests through the local helper, so browser CORS to Groq is avoided. Check that the helper is running, the key is valid, the selected model is available, and your network can reach Groq.';}
    chat.updatedAt=Date.now();await persistChat(chat);renderAll();
  }finally{busy=false;activeController=null;$('#sendBtn').classList.remove('hidden');$('#stopBtn').classList.add('hidden');$('#prompt').disabled=false;$('#prompt').focus();}
}
function updateStreamingMessage(bot){const node=$(`[data-message-id="${CSS.escape(bot.id)}"]`);if(!node){renderMessages();return;}const body=$('.bot-body',node);if(body){body.innerHTML=renderMarkdownSafe(bot.text||'');if(!bot.text){const typing=document.createElement('div');typing.className='typing';typing.innerHTML='<span></span><span></span><span></span>';body.append(typing);}}scrollBottom(false);}
function startFlowFinish(id){const node=$(`[data-message-id="${CSS.escape(id)}"]`);if(!node)return;node.classList.add('flowing');clearTimeout(flowTimer);flowTimer=setTimeout(()=>{node.classList.remove('flowing');},1800);}
function stopGeneration(){if(activeController)activeController.abort();}
function regenerate(messageId){const chat=activeChat();if(!chat||busy)return;const idx=chat.messages.findIndex(m=>m.id===messageId);if(idx<0||chat.messages[idx].role!=='assistant')return;sendMessage('',messageId);}
function settingsShortcutModel(){showModal('Choose a free model',`<div class="help">Pick a model for new requests. Image messages automatically use Qwen 3.8 27B.</div><div class="field"><label for="quickModel">Model</label><select id="quickModel">${FREE_MODELS.map(m=>`<option value="${m.id}" ${appSettings.model===m.id?'selected':''}>${m.name} — ${m.note}</option>`).join('')}</select></div>`,[{label:'Cancel',action:closeModal},{label:'Apply',primary:true,action:()=>{appSettings.model=normalizeModel($('#quickModel').value);saveSettings();updateModelLabel();closeModal();toast('Default model set to '+modelInfo().name);}}]);}
function handlePinSubmit(e){e.preventDefault();if($('#accessCode').value===ACCESS_CODE){enterApp();$('#pinError').textContent='';$('#accessCode').value='';startAutoLock();initializeWorkspace();}else{$('#pinError').textContent='That access code is not correct.';$('#accessCode').select();}}
async function initializeWorkspace(){try{chats=await dbGetAll();chats.sort((a,b)=>b.updatedAt-a.updatedAt);activeChatId=chats[0]?.id||null;setSaveState(true,'Saved on this device');}catch(e){chats=[];activeChatId=null;setSaveState(false,'Local storage unavailable');toast('Browser chat storage could not be opened. '+e.message,5000);}renderAll();}

// Event wiring
$('#pinForm').addEventListener('submit',handlePinSubmit);
$('#accessRequestBtn').addEventListener('click',showAccessInfo);
$('#newChatBtn').addEventListener('click',createChat);
$('#collapseSidebar').addEventListener('click',()=>$('#sidebar').classList.add('collapsed'));
$('#showSidebar').addEventListener('click',()=>$('#sidebar').classList.toggle('collapsed'));
$('#chatSearch').addEventListener('input',renderHistory);
$('#settingsBtn').addEventListener('click',showSettings);$('#topSettingsBtn').addEventListener('click',showSettings);$('#memoryBtn').addEventListener('click',showMemory);$('#memoryInline').addEventListener('click',e=>{e.preventDefault();showMemory();});
$('#smartModelBtn').addEventListener('click',settingsShortcutModel);
$('#exportBtn').addEventListener('click',exportChat);$('#printBtn').addEventListener('click',printChat);
$('#chatModeBtn').addEventListener('click',()=>{$('#chatModeBtn').classList.add('active');$('#agentModeBtn').classList.remove('active');});
$('#agentModeBtn').addEventListener('click',()=>{toast('Agent mode is not implemented in this single-file version; Chat mode is ready.');});
$('#prompt').addEventListener('input',autoGrow);
$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
$('#sendBtn').addEventListener('click',()=>sendMessage());$('#stopBtn').addEventListener('click',stopGeneration);
$('#attachBtn').addEventListener('click',()=>$('#fileInput').click());$('#fileInput').addEventListener('change',async e=>{await processFiles(Array.from(e.target.files||[]));e.target.value='';});
$$('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#chatSearch').focus();}if(e.key==='Escape'&&currentModal)closeModal();});
['pointerdown','keydown','touchstart'].forEach(name=>document.addEventListener(name,handleActivity,{passive:true}));
window.addEventListener('beforeunload',()=>{if(busy&&activeController)activeController.abort();});
try{if(sessionStorage.getItem('ace_unlocked_v1')==='yes'){const last=Number(sessionStorage.getItem('ace_last_active_v1')||Date.now());if(!appSettings.pinLockMinutes||Date.now()-last<appSettings.pinLockMinutes*60000){enterApp();startAutoLock();initializeWorkspace();}else{sessionStorage.removeItem('ace_unlocked_v1');}}}catch{}
})();
</script>
